<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Callbacks</title></head><body><h1>Callbacks and Higher-Order Functions</h1><pre id="output"></pre><script>const numbers=[1,2,3,4,5];function processNumbers(items,callback){return items.map(callback)}const doubled=processNumbers(numbers,n=>n*2);const even=numbers.filter(n=>n%2===0);document.getElementById("output").textContent="Original: "+numbers.join(", ")+"\\nDoubled: "+doubled.join(", ")+"\\nEven numbers: "+even.join(", ");function greet(name,callback){callback("Hello, "+name)}greet("Shivam",message=>console.log(message));</script></body></html>
