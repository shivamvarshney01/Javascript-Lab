<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operators and Calculator</title></head><body><h1>Basic Calculator</h1><input id="a" type="number" placeholder="First number"><select id="op"><option value="+">+</option><option value="-">−</option><option value="*">×</option><option value="/">÷</option><option value="%">%</option></select><input id="b" type="number" placeholder="Second number"><button id="calc">Calculate</button><p id="result">Result: —</p><script>document.getElementById("calc").addEventListener("click",()=>{const x=Number(document.getElementById("a").value),y=Number(document.getElementById("b").value),op=document.getElementById("op").value;let r;if(!document.getElementById("a").value||!document.getElementById("b").value)r="Enter both numbers";else if(op==="/"&&y===0)r="Cannot divide by zero";else r=({"+":()=>x+y,"-":()=>x-y,"*":()=>x*y,"/":()=>x/y,"%":()=>x%y})[op]();document.getElementById("result").textContent="Result: "+r});console.log("5" + 2, Number("5") + 2);</script></body></html>
