<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Promises and Async Await</title></head><body><h1>Promises and Async/Await</h1><button id="load">Run asynchronous task</button><p id="output"></p><script>function wait(ms){return new Promise(resolve=>setTimeout(()=>resolve("Task completed after "+ms+" ms."),ms))}async function runTask(){const output=document.getElementById("output");output.textContent="Working...";try{const message=await wait(1200);output.textContent=message}catch(error){output.textContent="Error: "+error.message}}document.getElementById("load").addEventListener("click",runTask);wait(500).then(message=>console.log("Promise example:",message));</script></body></html>
