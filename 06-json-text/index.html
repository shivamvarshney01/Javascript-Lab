<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON and Text</title></head><body><h1>JSON and Text Operations</h1><textarea id="source" rows="5" cols="40">{"name":"Shivam","studentId":"BCS2025453","course":"B.Tech CSE"}</textarea><br><button id="parse">Parse JSON</button><pre id="output"></pre><script>document.getElementById("parse").onclick=()=>{try{const student=JSON.parse(source.value);output.textContent=JSON.stringify(student,null,2)+"\\nName in uppercase: "+String(student.name).toUpperCase()}catch(error){output.textContent="Invalid JSON: "+error.message}};</script></body></html>
