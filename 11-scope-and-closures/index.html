<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scope and Closures</title></head><body><h1>Closure Counter</h1><p id="count">0</p><button id="increment">Increment</button><button id="reset">Reset</button><script>function createCounter(){let count=0;return {increment(){return ++count},reset(){count=0;return count}}}const counter=createCounter();const display=document.getElementById("count");document.getElementById("increment").onclick=()=>display.textContent=counter.increment();document.getElementById("reset").onclick=()=>display.textContent=counter.reset();</script></body></html>
