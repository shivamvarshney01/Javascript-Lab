<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Functions</title></head><body><h1>Function Practice</h1><label>Enter a number <input id="n" type="number" value="5"></label><button id="run">Calculate</button><p id="answer"></p><script>function factorial(n){if(n<0||!Number.isInteger(n))return null;let result=1;for(let i=2;i<=n;i++)result*=i;return result}const square=n=>n*n;document.getElementById("run").addEventListener("click",()=>{const n=Number(document.getElementById("n").value);document.getElementById("answer").textContent=factorial(n)===null?"Enter a non-negative integer.": "Square: "+square(n)+" | Factorial: "+factorial(n)});</script></body></html>
