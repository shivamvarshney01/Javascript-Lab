<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inheritance and Composition</title></head><body><h1>Inheritance Demo</h1><pre id="output"></pre><script>class Person{constructor(name){this.name=name}greet(){return "Hello, I am "+this.name+"."}}class Student extends Person{constructor(name,id){super(name);this.id=id}details(){return this.greet()+" My student ID is "+this.id+"."}}const learner=new Student("Shivam","BCS2025453");const canStudy={study(){return this.name+" is studying JavaScript."}};Object.assign(Student.prototype,canStudy);document.getElementById("output").textContent=learner.details()+"\\n"+learner.study();</script></body></html>
