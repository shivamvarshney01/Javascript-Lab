<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOM and Quiz</title></head><body><h1>JavaScript Mini Quiz</h1><p>Which keyword declares a block-scoped variable?</p><label><input type="radio" name="answer" value="var"> var</label><br><label><input type="radio" name="answer" value="let"> let</label><br><label><input type="radio" name="answer" value="print"> print</label><br><button id="submit">Submit</button><p id="result"></p><script>const result=document.getElementById("result");const saved=localStorage.getItem("quizName");if(saved)result.textContent="Welcome back, "+saved+"!";document.getElementById("submit").onclick=()=>{const selected=document.querySelector('input[name="answer"]:checked');if(!selected){result.textContent="Please select an answer.";return}result.textContent=selected.value==="let"?"Correct! Well done.":"Not quite. The correct answer is let.";localStorage.setItem("quizName","Shivam")};</script></body></html>
