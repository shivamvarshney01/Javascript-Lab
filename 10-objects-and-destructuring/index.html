<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Objects and Destructuring</title></head><body><h1>Object Destructuring</h1><pre id="output"></pre><script>const student={name:"Shivam",studentId:"BCS2025453",program:"B.Tech CSE",semester:3,address:{city:"Bahjoi",state:"Uttar Pradesh"}};const {name,studentId,program,semester,address:{city,state}}=student;const skills=["HTML","CSS","JavaScript"];const [first,second,...remaining]=skills;document.getElementById("output").textContent=[name,studentId,program,"Semester "+semester,city+", "+state,"Skills: "+first+", "+second+", "+remaining.join(", ")].join("\\n");</script></body></html>
