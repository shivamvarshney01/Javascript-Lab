<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Array Iteration Methods</title></head><body><h1>Array Iteration Methods</h1><pre id="output"></pre><script>const marks=[78,85,92,64,88];const total=marks.reduce((sum,mark)=>sum+mark,0);const percentages=marks.map(mark=>mark+"%");const hasFailed=marks.some(mark=>mark<40);const allPassed=marks.every(mark=>mark>=40);document.getElementById("output").textContent="Marks: "+marks.join(", ")+"\\nTotal: "+total+"\\nAverage: "+(total/marks.length).toFixed(2)+"\\nFormatted: "+percentages.join(", ")+"\\nAny failed: "+hasFailed+"\\nAll passed: "+allPassed;</script></body></html>
