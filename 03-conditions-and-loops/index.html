<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conditions and Loops</title></head><body><h1>Number Checker</h1><input id="number" type="number" placeholder="Enter an integer"><button id="check">Check</button><p id="output"></p><h2>Multiplication table</h2><pre id="table"></pre><script>document.getElementById("check").addEventListener("click",()=>{const raw=document.getElementById("number").value,n=Number(raw);if(raw===""){output.textContent="Please enter a number.";return}output.textContent=n===0?"The number is zero.":n%2===0?"The number is even.":"The number is odd.";let lines=[];for(let i=1;i<=10;i++)lines.push(n+" × "+i+" = "+n*i);table.textContent=lines.join("\\n")});</script></body></html>
