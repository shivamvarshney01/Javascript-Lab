<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Classes</title></head><body><h1>Student Class</h1><pre id="output"></pre><script>class Student{constructor(name,id,course){this.name=name;this.id=id;this.course=course}introduce(){return "I am "+this.name+", ID "+this.id+", studying "+this.course+"."}}const student=new Student("Shivam","BCS2025453","B.Tech CSE");document.getElementById("output").textContent=student.introduce();function Book(title,author){this.title=title;this.author=author}const book=new Book("JavaScript Basics","Lab Practice");console.log(book);</script></body></html>
