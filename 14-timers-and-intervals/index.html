<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timers and Intervals</title></head><body><h1>Stopwatch</h1><p id="time">0 seconds</p><button id="start">Start</button><button id="stop">Stop</button><button id="reset">Reset</button><script>let seconds=0,timer=null;const display=document.getElementById("time");function render(){display.textContent=seconds+" seconds"}document.getElementById("start").onclick=()=>{if(timer===null)timer=setInterval(()=>{seconds++;render()},1000)};document.getElementById("stop").onclick=()=>{clearInterval(timer);timer=null};document.getElementById("reset").onclick=()=>{clearInterval(timer);timer=null;seconds=0;render()};</script></body></html>
