<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arrays</title></head><body><h1>Array Methods Demo</h1><input id="item" placeholder="Add a fruit"><button id="add">Add</button><button id="sort">Sort</button><button id="clear">Clear</button><ul id="list"></ul><p id="summary"></p><script>let fruits=["Apple","Mango","Banana"];function render(){list.innerHTML="";fruits.forEach((fruit,index)=>{const li=document.createElement("li");li.textContent=fruit+" ";const remove=document.createElement("button");remove.textContent="Remove";remove.onclick=()=>{fruits.splice(index,1);render()};li.append(remove);list.append(li)});summary.textContent="Total fruits: "+fruits.length}add.onclick=()=>{const value=item.value.trim();if(value){fruits.push(value);item.value="";render()}};sort.onclick=()=>{fruits.sort((a,b)=>a.localeCompare(b));render()};clear.onclick=()=>{fruits=[];render()};render();</script></body></html>
